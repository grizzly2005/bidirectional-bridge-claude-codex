name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run skills:check
      - run: npm run links:check
      - run: node scripts/test-shared-memory.mjs
      - run: node shared/web-audit/examples/cli-smoke.mjs
      - run: node docs/tools/check-doc-links.mjs
      - run: node scripts/certification-manifest.mjs
      - run: npm audit --audit-level=low
      - if: runner.os == 'Linux'
        run: npm run test:tracking-permissions
      - if: runner.os == 'Linux'
        run: python3 scripts/test-release-package.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tracking-ui
        env:
          BRIDGE_TEST_BROWSER_CHANNEL: chromium
      - run: git diff --exit-code
      - name: Package this exact candidate
        if: runner.os == 'Linux'
        run: |
          mkdir -p tmp/candidate-assets
          npm sbom --sbom-format cyclonedx --omit dev --workspaces --include-workspace-root > tmp/candidate-sbom.json
          python3 scripts/package-release.py --sbom tmp/candidate-sbom.json --output tmp/candidate-assets
      - name: Attest candidate build provenance
        if: runner.os == 'Linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tmp/candidate-assets/*
      - name: Upload candidate assets
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/candidate-assets/*
          if-no-files-found: error
          retention-days: 14
